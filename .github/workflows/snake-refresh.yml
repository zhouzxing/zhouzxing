name: snake-refresh

on:
  schedule:
    # Monday 02:00 UTC — right after the previous week closes, so the data
    # is never stale for long.
    - cron: '0 2 * * 1'
  workflow_dispatch:

# The script reads its own repo plus the active repos, so read-only is fine
# for fetching; write is only needed for the commit step.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch commit activity and regenerate the snake SVG
        env:
          # GITHUB_TOKEN is injected automatically; snake_activity_fetch.py
          # picks it up to stay well inside the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 snake_activity_fetch.py
          python3 snake_gen.py
          python3 snake_game_fetch.py
          python3 snake_game_gen.py

      - name: Commit only if the SVG changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- snake.svg snake_data.json snake_game.svg snake_game_data.json; then
            echo "no change — skipping commit"
            exit 0
          fi

          git add snake.svg snake_data.json snake_game.svg snake_game_data.json
          git commit -m "chore: refresh snake animations"
          git push origin main
